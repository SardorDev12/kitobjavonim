name: Build and publish web export

# Plesk's hosting for this project runs Git deploy actions in a chroot that
# can't reach a real Node.js install (SSH access is forbidden for the
# domain's system user, and Plesk chroots deploy actions to the
# subscription's home directory whenever that's the case — see
# docs/plesk-deploy.md). So the build happens here instead: this workflow
# builds the static web export and pushes just the output to the `deploy`
# branch, which Plesk's Git panel points at directly (target directory
# httpdocs, no additional deploy actions needed) — Plesk only ever has to
# sync already-built files, the one part of that pipeline that's reliable.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # .env.production is committed (see the note in that file) and is what
      # this build reads its EXPO_PUBLIC_* values from.
      - run: npx expo export --platform web --clear

      # A cheap way to tell, from outside, exactly which build is currently
      # live — needed below to know when Plesk has actually finished pulling
      # this build, not just when it was pushed here.
      - run: echo "${{ github.sha }}" > dist/.build-sha

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: deploy
          force_orphan: true

      # Plesk pulls the `deploy` branch via its own webhook (configured
      # separately, in Plesk's Git repository settings) and syncs it into
      # httpdocs — but that happens asynchronously, on Plesk's own schedule,
      # with no callback here. Purging Cloudflare's cache before that sync
      # actually lands would be worse than not purging at all: the next
      # visitor's request would just re-cache the *old* files again. So this
      # polls the live site's own build marker (bypassing Cloudflare's cache
      # with a random query string each time) until it matches this build,
      # then purges — never purging blind.
      - name: Wait for Plesk to deploy this build
        id: wait_for_deploy
        run: |
          for i in $(seq 1 30); do
            live_sha="$(curl -fsS "https://kitobjavonim.uz/.build-sha?_=$RANDOM$RANDOM" || true)"
            if [ "$live_sha" = "${{ github.sha }}" ]; then
              echo "landed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 10
          done
          echo "landed=false" >> "$GITHUB_OUTPUT"

      - name: Purge Cloudflare cache
        if: steps.wait_for_deploy.outputs.landed == 'true'
        run: |
          curl -fsS -X POST "https://api.cloudflare.com/client/v4/zones/${{ secrets.CLOUDFLARE_ZONE_ID }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}'

      - name: Warn if Plesk never picked up the build
        if: steps.wait_for_deploy.outputs.landed == 'false'
        run: |
          echo "::warning::kitobjavonim.uz still shows an older build after 5 minutes of polling. Check Plesk's webhook (Git > Repository Settings) is configured and firing, or deploy manually — Cloudflare's cache was NOT purged, since purging before the real files land would just re-cache the old ones."
