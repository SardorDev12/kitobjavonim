name: EAS Update

# Publishes an over-the-air JS update to the already-installed app instead of
# requiring a fresh native build for every change — see eas.json's per-profile
# "channel" and app.config.js's "updates"/"runtimeVersion" for the other half
# of this setup. Only covers JS-only changes; anything that touches native
# code (a new native dependency, a permission, app.config.js's icon/splash/
# plugins/package name) still needs a real build through the usual EAS flow,
# since the installed binary itself doesn't change here.
#
# develop -> "preview" channel, main -> "production" channel — a straight
# 1:1 mapping. These are two separate installs on the device (distinct
# Android package names/app icons, set in app.config.js via APP_VARIANT —
# see eas.json's "preview" profile), each permanently pointed at its own
# Supabase project, so there is no more "re-point the one test device at
# whichever data set" step this used to need when both variants shared a
# single install.
on:
  push:
    branches: [develop, main]
    paths-ignore:
      - "admin/**"
      - "landing/**"
      - "supabase/**"
      - "*.md"

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Publish update
        # The commit message is passed via env, not interpolated straight into
        # `run:` — a multi-line message containing its own quotes (as one
        # eventually will) breaks out of the shell string GitHub Actions
        # builds and gets split into extra positional args, failing the
        # command. Routing it through $UPDATE_MESSAGE and letting bash quote
        # it once avoids that regardless of what the message contains.
        run: >
          eas update
          --channel ${{ github.ref_name == 'main' && 'production' || 'preview' }}
          --message "$UPDATE_MESSAGE"
          --non-interactive
        env:
          UPDATE_MESSAGE: "[${{ github.ref_name }}] ${{ github.event.head_commit.message }}"
          EXPO_PUBLIC_SUPABASE_URL: ${{ github.ref_name == 'main' && 'https://zsrhzjujoahresqfhpks.supabase.co' || 'https://ahpsnvxpduaqrkvmpfck.supabase.co' }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ github.ref_name == 'main' && 'sb_publishable_jsqMsYY3fmBTkIyrcD8E7g_ve9Ef1Ww' || 'sb_publishable_nM9zD2eA5FtbkwEG_ISdnQ_W8ae4FQ3' }}
          EXPO_PUBLIC_TELEGRAM_BOT_USERNAME: home_library_signin_bot
          EXPO_PUBLIC_WEB_ORIGIN: ${{ github.ref_name == 'main' && 'https://app.kitobjavonim.uz' || 'https://test.kitobjavonim.uz' }}
