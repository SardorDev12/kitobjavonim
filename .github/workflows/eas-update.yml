name: EAS Update

# Publishes an over-the-air JS update to the already-installed app instead of
# requiring a fresh native build for every change — see eas.json's per-profile
# "channel" and app.json's "updates"/"runtimeVersion" for the other half of
# this setup. Only covers JS-only changes; anything that touches native code
# (a new native dependency, a permission, app.json's icon/splash/plugins)
# still needs a real build through the usual EAS flow, since the installed
# binary itself doesn't change here.
#
# Both branches publish to the "preview" channel — the one channel the
# installed testing APK listens on. There is only the one physical test
# device, so there is nothing for a second channel to reach there; a develop
# push re-points that install at staging data to test against, and a main
# push re-points it at production data once a change has been confirmed
# good. `eas update` has no memory of eas.json's build-time `env` blocks
# (those only apply to `eas build`), so the right EXPO_PUBLIC_* values have
# to be set explicitly here per branch, or the published bundle would ship
# with them empty and the app would fail to start.
#
# main additionally publishes to "production" — the channel a real Play
# Store build (eas.json's production profile) listens on. develop never
# touches it: staging data must never reach a live install. By the time a
# change lands on main it has already been tested via the preview channel
# on staging first, so this follows the same develop-then-main promotion
# path as everything else in this repo rather than needing a separate
# manual publish step.
on:
  push:
    branches: [develop, main]
    paths-ignore:
      - "admin/**"
      - "supabase/**"
      - "*.md"

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Publish update to the preview channel
        # The commit message is passed via env, not interpolated straight into
        # `run:` — a multi-line message containing its own quotes (as one
        # eventually will) breaks out of the shell string GitHub Actions
        # builds and gets split into extra positional args, failing the
        # command. Routing it through $UPDATE_MESSAGE and letting bash quote
        # it once avoids that regardless of what the message contains.
        run: eas update --channel preview --message "$UPDATE_MESSAGE" --non-interactive
        env:
          UPDATE_MESSAGE: "[${{ github.ref_name }}] ${{ github.event.head_commit.message }}"
          # develop -> staging Supabase, matching eas.json's "development"
          # profile; main -> production Supabase, matching "preview"/
          # "production" — same split used everywhere else in this repo.
          EXPO_PUBLIC_SUPABASE_URL: ${{ github.ref_name == 'main' && 'https://zsrhzjujoahresqfhpks.supabase.co' || 'https://ahpsnvxpduaqrkvmpfck.supabase.co' }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ github.ref_name == 'main' && 'sb_publishable_jsqMsYY3fmBTkIyrcD8E7g_ve9Ef1Ww' || 'sb_publishable_nM9zD2eA5FtbkwEG_ISdnQ_W8ae4FQ3' }}
          EXPO_PUBLIC_TELEGRAM_BOT_USERNAME: home_library_signin_bot
          EXPO_PUBLIC_WEB_ORIGIN: ${{ github.ref_name == 'main' && 'https://www.kitobjavonim.uz' || 'https://kitobjavonim-staging.sardorfarhodogli.workers.dev' }}

      - name: Publish update to the production channel
        if: github.ref_name == 'main'
        run: eas update --channel production --message "$UPDATE_MESSAGE" --non-interactive
        env:
          UPDATE_MESSAGE: ${{ github.event.head_commit.message }}
          EXPO_PUBLIC_SUPABASE_URL: https://zsrhzjujoahresqfhpks.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_jsqMsYY3fmBTkIyrcD8E7g_ve9Ef1Ww
          EXPO_PUBLIC_TELEGRAM_BOT_USERNAME: home_library_signin_bot
          EXPO_PUBLIC_WEB_ORIGIN: https://www.kitobjavonim.uz
