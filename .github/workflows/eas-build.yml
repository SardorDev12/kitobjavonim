name: EAS Build

# Manual, unlike eas-update.yml — building a new native binary is a
# deliberate, occasional action (a new native dependency, an app.config.js
# change), not something that should fire on every push. Triggered from the
# GitHub Actions tab: this repo → Actions → "EAS Build" → Run workflow, pick
# the branch/profile/platform there. Runs entirely on GitHub's and Expo's
# infrastructure — nothing local required.
#
# Reuses the same EXPO_TOKEN secret eas-update.yml already authenticates
# with. eas.json's per-profile "env" block (unlike eas-update.yml's OTA
# publishes) is respected by `eas build` automatically, so it doesn't need
# repeating here.
#
# eas.json's "cli.appVersionSource" is "local" — app.config.js's
# android.versionCode / ios.buildNumber are the only source of truth for
# the store version number (see the "Switch Android version code to local,
# manual tracking" commit for why: EAS's own "remote" counter drifted out
# of sync with what Google Play actually had on record and kept producing
# version codes Play had already rejected). For a "production" build, the
# "Bump native version" step below increments those fields and commits the
# result before the build runs, so every production build automatically
# gets a version code/build number one higher than the last one committed
# — no server-side counter involved, git is the only state.
on:
  workflow_dispatch:
    inputs:
      profile:
        description: "eas.json build profile"
        required: true
        default: "production"
        type: choice
        options: [development, preview, production]
      platform:
        description: "Target platform"
        required: true
        default: "android"
        type: choice
        options: [android, ios, all]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Bump native version (production only)
        if: inputs.profile == 'production'
        run: |
          node scripts/bump-native-version.js ${{ inputs.platform }}
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app.config.js
          git commit -m "Bump native version for production build (${{ inputs.platform }}) [skip ci]"
          git push origin HEAD:${{ github.ref_name }}

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build
        run: eas build --profile ${{ inputs.profile }} --platform ${{ inputs.platform }} --non-interactive
