name: Deploy Landing Page

# Publishes landing/public/ as-is to Cloudflare — no build step at all (see
# landing/README.md), so this is just an upload, not a compile-then-upload
# the way eas-update.yml or the admin build is.
#
# develop -> kitobjavonim-landing-staging, main -> kitobjavonim-landing (the
# name landing/wrangler.jsonc itself carries) — same staging/production
# Worker split as the admin panel's own deploy, and for the same reason:
# a landing-only change should never be able to touch the production
# subdomain until it's gone through develop first.
on:
  push:
    branches: [develop, main]
    paths:
      - "landing/**"
  # Lets a redeploy be triggered by hand from the Actions tab without a
  # dummy commit under landing/** — e.g. right after fixing this workflow
  # itself, which a path-scoped push trigger can't do for its own change.
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: landing
          # Without this the action installs whatever wrangler 3.x satisfies
          # its default range, and 3.x's `deploy` demands a script
          # entry-point (`main`) even for an assets-only Worker like this
          # one — "Missing entry-point" at deploy time. wrangler 4.x deploys
          # assets-only config with no `main` at all; admin/package.json
          # already pins the same major version for its own deploy for
          # exactly this reason.
          wranglerVersion: "4"
          command: >-
            deploy
            ${{ github.ref_name != 'main' && '--name kitobjavonim-landing-staging' || '' }}
